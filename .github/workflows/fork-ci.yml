name: Fork CI

# Fork-scoped gate: full upstream unit suite plus the foreground-run promotion
# tests must stay green on every fork change and future upstream rebase.
on:
  push:
    branches: [feat/background-work-promotion]
  pull_request:
    branches: [feat/background-work-promotion]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: npm run test:unit
